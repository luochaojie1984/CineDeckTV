name: CineDeckTV
options:
  bundleIdPrefix: local.personal
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true

packages:
  MediaCoreKit:
    path: Packages/MediaCoreKit
  FSPlayer:
    url: https://github.com/debugly/FSPlayer-SPM.git
    exactVersion: 1.1.3
  # 通过 scripts/prepare_amsmb2.sh 检出并注入 5 项 Windows/SMB2 关键补丁后替换成本地路径
  AMSMB2:
    url: https://github.com/amosavian/AMSMB2.git
    revision: 8d8e19ebeaf71cca1f66b3689034b58ba333c44f

targets:
  CineDeckTV:
    type: application
    platform: tvOS
    sources:
      - path: Sources/TVApp
      - path: Sources/PlaybackEngine
      - path: Sources/TVAdapters
    dependencies:
      - package: MediaCoreKit
        product: NetworkVFS
      - package: MediaCoreKit
        product: LocalStreamProxy
      - package: MediaCoreKit
        product: SubtitleKit
      - package: MediaCoreKit
        product: AppPreferences
      - package: MediaCoreKit
        product: PlaybackKit
      # 二进制 XCFramework：禁止 embed: true
      - package: FSPlayer
        product: FSPlayer
      # 源码编译的动态包：必须显式 embed
      - package: AMSMB2
        product: AMSMB2
        embed: true
    info:
      path: Sources/TVApp/Info.plist
      properties:
        CFBundleDisplayName: CineDeckTV
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        NSLocalNetworkUsageDescription: "用于发现并访问局域网内的 SMB / WebDAV 影音服务器"
        NSBonjourServices:
          - "_smb._tcp"
          - "_webdav._tcp"
          - "_webdavs._tcp"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.personal.cinedecktv
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "3"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_MODULE_VERIFIER: NO

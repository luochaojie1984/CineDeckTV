name: CineDeckTV CI (Ubuntu Tests + tvOS Unsigned IPA + Simulator Previews)

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests-ubuntu:
    name: MediaCoreKit tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift toolchain
        run: swift --version
      - name: Test MediaCoreKit on Linux
        working-directory: Packages/MediaCoreKit
        run: swift test --parallel

  build-tvos-unsigned-ipa:
    name: tvOS Release build + unsigned IPA
    needs: core-tests-ubuntu
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode & tvOS SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i appletvos || true
      - name: Fetch & patch AMSMB2 Vendor
        run: bash scripts/prepare_amsmb2.sh --patch-project-yml
      - name: Install XcodeGen & Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build tvOS Release (unsigned)
        run: |
          xcodebuild clean build \
            -project CineDeckTV.xcodeproj \
            -scheme CineDeckTV \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            SYMROOT="$(pwd)/build"
      - name: Verify embedded frameworks and Info.plist keys
        run: |
          set -euo pipefail
          APP="build/Release-appletvos/CineDeckTV.app"
          test -d "$APP" || { echo "::error::app bundle missing"; exit 1; }
          test -d "$APP/Frameworks/KSPlayer.framework" || { ls "$APP/Frameworks"; echo "::error::KSPlayer.framework not embedded"; exit 1; }
          test -d "$APP/Frameworks/FSPlayer.framework" || { echo "::error::FSPlayer.framework not embedded"; exit 1; }
          test -d "$APP/Frameworks/AMSMB2.framework" || { ls "$APP/Frameworks"; echo "::error::AMSMB2.framework not embedded"; exit 1; }
          test -f "$APP/Assets.car" || { ls -la "$APP"; echo "::error::Assets.car (tvOS App Icon) missing"; exit 1; }
          for f in CineDeck-Kaiti.ttf CineDeck-Songti.ttf CineDeck-Fangsong.ttf CineDeck-Yuanti.ttf CineDeck-Smiley.ttf; do
            test -f "$APP/Fonts/$f" || { ls -la "$APP" "$APP/Fonts" 2>/dev/null || true; echo "::error::Bundled Chinese font missing: $f"; exit 1; }
          done
          /usr/libexec/PlistBuddy -c "Print :NSLocalNetworkUsageDescription" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSBonjourServices" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          echo "=== CineDeckTV linked libraries ==="
          otool -L "$APP/CineDeckTV"
          otool -L "$APP/CineDeckTV" | grep -q "AVKit.framework/AVKit" || { echo "::error::AVKit.framework not linked in CineDeckTV binary!"; exit 1; }
          ls -la "$APP/Frameworks"
      - name: Package unsigned IPA
        run: |
          rm -rf Payload CineDeckTV-Unsigned.ipa
          mkdir -p Payload
          cp -R "build/Release-appletvos/CineDeckTV.app" Payload/
          zip -qry "CineDeckTV-Unsigned.ipa" Payload
          rm -rf Payload
          ls -lh CineDeckTV-Unsigned.ipa
          sha256sum CineDeckTV-Unsigned.ipa | tee CineDeckTV-Unsigned.ipa.sha256
      - name: Upload IPA + checksum
        uses: actions/upload-artifact@v4
        with:
          name: CineDeckTV-Unsigned-tvOS-IPA
          path: |
            CineDeckTV-Unsigned.ipa
            CineDeckTV-Unsigned.ipa.sha256
          retention-days: 30

  preview-tvos-screenshots:
    name: tvOS 27 Simulator Multi-Screen Screenshots
    needs: core-tests-ubuntu
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[preview]')
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Fetch & patch AMSMB2 Vendor
        run: bash scripts/prepare_amsmb2.sh --patch-project-yml
      - name: Install XcodeGen & Generate Simulator project (exclude device-only KSPlayer)
        run: |
          brew install xcodegen
          python3 -c 'import re; txt=open("project.yml").read(); txt=re.sub(r"\n  KSPlayer:\n    url:[^\n]+\n    exactVersion:[^\n]+\n", "\n", txt); txt=re.sub(r"\s*- package: KSPlayer\s*\n\s*product: KSPlayer(?:UI)?\s*\n", "\n", txt); open("project.yml","w").write(txt)'
          xcodegen generate
      - name: Build Debug app for tvOS Simulator
        run: |
          xcodebuild clean build \
            -project CineDeckTV.xcodeproj \
            -scheme CineDeckTV \
            -sdk appletvsimulator \
            -destination 'generic/platform=tvOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$(pwd)/sim-build"
      - name: Boot tvOS Simulator and capture 6 screen previews
        run: |
          set -euo pipefail
          UDID=$(python3 -c 'import json,subprocess; d=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","-j"])); ts=[devs for k,devs in sorted(d.get("devices",{}).items(),reverse=True) if "tvOS" in k and devs]; print(next((x["udid"] for x in ts[0] if "Apple TV 4K" in x.get("name","")), ts[0][0]["udid"]))')
          echo "Using tvOS Simulator UDID: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP="sim-build/Debug-appletvsimulator/CineDeckTV.app"
          xcrun simctl install "$UDID" "$APP"
          mkdir -p screenshots
          for screen in home browser-grid browser-list sources player-hud settings; do
            xcrun simctl terminate "$UDID" local.personal.cinedecktv || true
            SIMCTL_CHILD_CINEDECK_PREVIEW_SCREEN="$screen" xcrun simctl launch "$UDID" local.personal.cinedecktv "--preview-screen=$screen"
            sleep 4
            xcrun simctl io "$UDID" screenshot "screenshots/${screen}.png"
            ls -lh "screenshots/${screen}.png"
            test -s "screenshots/${screen}.png"
          done
      - name: Live Playback Smoke Test (Real FSPlayer + LocalHTTPStreamProxy + DisplayModeCoordinator)
        run: |
          set -euo pipefail
          UDID=$(python3 -c 'import json,subprocess; d=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","-j"])); ts=[devs for k,devs in sorted(d.get("devices",{}).items(),reverse=True) if "tvOS" in k and devs]; print(next((x["udid"] for x in ts[0] if "Apple TV 4K" in x.get("name","")), ts[0][0]["udid"]))')
          DATA_DIR=$(xcrun simctl get_app_container "$UDID" local.personal.cinedecktv data)
          echo "App data container: $DATA_DIR"
          mkdir -p "$DATA_DIR/tmp"
          SMOKE_MP4="$DATA_DIR/tmp/smoke.mp4"
          SMOKE_STATUS="$DATA_DIR/tmp/smoke-status.txt"
          rm -f "$SMOKE_MP4" "$SMOKE_STATUS"

          swift - "$SMOKE_MP4" <<'SWIFT'
          import Foundation
          import AVFoundation
          import CoreVideo

          let outPath = CommandLine.arguments[1]
          let outURL = URL(fileURLWithPath: outPath)
          let width = 1280
          let height = 720
          let fps: Int32 = 30
          let totalFrames = 120

          let writer = try AVAssetWriter(outputURL: outURL, fileType: .mp4)
          let settings: [String: Any] = [
              AVVideoCodecKey: AVVideoCodecType.h264,
              AVVideoWidthKey: width,
              AVVideoHeightKey: height
          ]
          let input = AVAssetWriterInput(mediaType: .video, outputSettings: settings)
          input.expectsMediaDataInRealTime = false
          let attrs: [String: Any] = [
              kCVPixelBufferPixelFormatTypeKey as String: kCVPixelFormatType_32BGRA,
              kCVPixelBufferWidthKey as String: width,
              kCVPixelBufferHeightKey as String: height
          ]
          let adaptor = AVAssetWriterInputPixelBufferAdaptor(assetWriterInput: input, sourcePixelBufferAttributes: attrs)
          writer.add(input)
          writer.startWriting()
          writer.startSession(atSourceTime: .zero)

          for frameIndex in 0..<totalFrames {
              while !input.isReadyForMoreMediaData {
                  Thread.sleep(forTimeInterval: 0.005)
              }
              var pbOpt: CVPixelBuffer?
              guard let pool = adaptor.pixelBufferPool else {
                  fatalError("Missing pixelBufferPool")
              }
              CVPixelBufferPoolCreatePixelBuffer(nil, pool, &pbOpt)
              guard let pb = pbOpt else {
                  fatalError("Failed to create CVPixelBuffer")
              }
              CVPixelBufferLockBaseAddress(pb, [])
              if let base = CVPixelBufferGetBaseAddress(pb) {
                  let bpr = CVPixelBufferGetBytesPerRow(pb)
                  let ptr = base.assumingMemoryBound(to: UInt8.self)
                  let shift = (frameIndex * 3) & 0xFF
                  for y in 0..<height {
                      let row = ptr.advanced(by: y * bpr)
                      let g = UInt8((y * 255) / height)
                      let r = UInt8((shift + (y / 4)) & 0xFF)
                      let b = UInt8(220)
                      for x in stride(from: 0, to: width * 4, by: 4) {
                          row[x] = b
                          row[x + 1] = g
                          row[x + 2] = r
                          row[x + 3] = 255
                      }
                  }
              }
              CVPixelBufferUnlockBaseAddress(pb, [])
              let pts = CMTime(value: CMTimeValue(frameIndex), timescale: fps)
              adaptor.append(pb, withPresentationTime: pts)
          }

          input.markAsFinished()
          let sem = DispatchSemaphore(value: 0)
          writer.finishWriting {
              sem.signal()
          }
          sem.wait()
          if writer.status != .completed {
              fatalError("AVAssetWriter failed: \(String(describing: writer.error))")
          }
          print("Generated smoke.mp4 successfully")
          SWIFT

          ls -lh "$SMOKE_MP4"
          test -s "$SMOKE_MP4"

          BEFORE_LOGS=$(ls -1 "$HOME/Library/Logs/DiagnosticReports"/CineDeckTV* 2>/dev/null || true)
          xcrun simctl terminate "$UDID" local.personal.cinedecktv || true
          LAUNCH_OUT=$(SIMCTL_CHILD_CINEDECK_SMOKE_TEST_VIDEO="$SMOKE_MP4" SIMCTL_CHILD_CINEDECK_SMOKE_TEST_STATUS="$SMOKE_STATUS" xcrun simctl launch "$UDID" local.personal.cinedecktv)
          echo "Launch output: $LAUNCH_OUT"
          PID=$(echo "$LAUNCH_OUT" | awk -F': ' '{print $2}' | tr -d '[:space:]')
          echo "Launched PID: $PID"

          sleep 6
          xcrun simctl io "$UDID" screenshot "screenshots/smoke-playback.png"
          ls -lh "screenshots/smoke-playback.png"
          test -s "screenshots/smoke-playback.png"

          ALIVE=0
          if [ -n "$PID" ] && ps -p "$PID" >/dev/null 2>&1; then
            ALIVE=1
          fi
          AFTER_LOGS=$(ls -1 "$HOME/Library/Logs/DiagnosticReports"/CineDeckTV* 2>/dev/null || true)
          echo "=== smoke-status.txt ==="
          cat "$SMOKE_STATUS" || true
          echo "=== Process alive: $ALIVE ==="

          if [ "$AFTER_LOGS" != "$BEFORE_LOGS" ]; then
            echo "::error::New CineDeckTV crash report detected!"
            for f in $AFTER_LOGS; do
              if ! echo "$BEFORE_LOGS" | grep -qx "$f"; then
                echo "=== Crash log: $f ==="
                head -n 160 "$f" || true
              fi
            done
            exit 1
          fi

          if [ "$ALIVE" != "1" ]; then
            echo "::error::CineDeckTV exited prematurely during live playback smoke test!"
            exit 1
          fi

          grep -q "fs-prepared" "$SMOKE_STATUS" || { echo "::error::FSPlayer did not reach fs-prepared!"; exit 1; }
          if grep -q "^[0-9.]* error:" "$SMOKE_STATUS"; then
            echo "::error::Smoke test recorded playback error!"
            exit 1
          fi
          grep -q "first-frame" "$SMOKE_STATUS" || echo "::warning::first-frame marker not logged within 6s (check screenshot)"
          xcrun simctl terminate "$UDID" local.personal.cinedecktv || true
      - name: Upload tvOS 27 Simulator screenshots
        uses: actions/upload-artifact@v4
        with:
          name: CineDeckTV-tvOS27-UI-Previews
          path: screenshots/*.png
          retention-days: 30
